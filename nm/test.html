<!DOCTYPE html>
<html lang="ru" data-course="nm" data-quiz="1">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Тест курса «Численные методы»: вопросы с выбором ответа, ограничение по времени, ответы сохраняются на сервере.">
<title>ЧМ · Тест</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>window.MathJax = {tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },options: { skipHtmlTags: ['script','noscript','style','textarea'] }, startup: { typeset: false }};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
:root{--bg:#faf8f4;--bg2:#f5f0e8;--bg3:#ede6da;--text:#2c2419;--text2:#6b5d4f;--text3:#9a8d7e;--accent:#b44a2d;--accent2:#1a6b5a;--accent3:#3a5ba0;--border:#d9cfc0;--card:#fff;--ok:#2c5a1f;--okbg:#dcecd6;--bad:#8a3220;--badbg:#fbeee7}
html.dark{--bg:#1b1712;--bg2:#231e18;--bg3:#2c261f;--text:#ece3d6;--text2:#bcb0a0;--text3:#8d8173;--accent:#e07a52;--accent2:#46b89c;--accent3:#82a0db;--border:#39322a;--card:#231e18;--ok:#a2d094;--okbg:#183021;--bad:#e6a08a;--badbg:#2a1a13}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.6;color:var(--text);background:var(--bg)}
.main{max-width:860px;margin:0 auto;padding:4rem 1.2rem 4rem}
.tag{font-family:'JetBrains Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;padding:.2rem .5rem;border-radius:3px;display:inline-block;margin-bottom:.5rem;background:#e0e8f2;color:#3a5ba0}
h1{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;line-height:1.15;margin-bottom:1.2rem}
.msg{margin:2rem auto;max-width:600px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.6rem 2rem;text-align:center}
.msg h2{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--accent);margin-bottom:.5rem}
.msg p{color:var(--text2);margin:.3rem 0}
.msg ul{text-align:left;margin:.8rem 0 1rem 1.3rem;color:var(--text2)}
.btn{background:var(--accent);color:#fff;border:none;padding:.6rem 1.4rem;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
.btn:hover{filter:brightness(.9)}.btn:disabled{opacity:.5;cursor:wait}
.bar{position:sticky;top:38px;z-index:5;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:.6rem 1rem;margin:0 0 1.2rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:.85rem}
.bar .timer{font-size:1.25rem;font-weight:600;color:var(--accent3);min-width:4.5em}
.bar .timer.low{color:var(--accent)}
.bar .cnt{color:var(--text2)}.bar .save{color:var(--text3);font-size:.75rem;flex:1}
.q{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem 1.2rem;margin:1rem 0}
.q .num{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:.35rem}
.q .text{margin-bottom:.6rem}
.q label{display:flex;gap:.6rem;align-items:flex-start;padding:.4rem .5rem;border-radius:5px;cursor:pointer;font-size:.95rem}
.q label:hover{background:var(--bg2)}
.q label input{margin-top:.35rem;flex:none}
.q label.right{background:var(--okbg);color:var(--ok)}
.q label.wrong{background:var(--badbg);color:var(--bad)}
.q .expl{margin-top:.6rem;padding:.6rem .8rem;border-left:3px solid var(--accent3);background:var(--bg2);font-size:.9rem;border-radius:0 5px 5px 0}
.q.done-ok{border-left:4px solid #4d8a35}.q.done-bad{border-left:4px solid var(--accent)}
.finish{text-align:center;margin:2rem 0}
.score{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:900;color:var(--accent3)}
@media(max-width:720px){body{font-size:16px}h1{font-size:1.5rem}.main{padding:3.5rem 1rem 3rem}.bar{top:0}}
</style>
</head>
<body>
<script src="../js/nav.js"></script>
<div class="main">
  <span class="tag">Тест</span>
  <h1 id="title">Тест</h1>
  <div id="app"><div class="msg"><p>загрузка…</p></div></div>
  <p style="margin-top:2rem;font-size:.85rem"><a href="index.html" style="color:var(--accent)">← Обзор курса</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/courses.js"></script>
<script src="../js/quiz.js"></script>
<script>
(function () {
  "use strict";
  const CID = document.documentElement.getAttribute("data-course");
  const QID = (new URLSearchParams(location.search).get("id") || "").replace(/[^A-Za-z0-9-]/g, "");
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const msg = (title, text, extra) => { app.innerHTML = '<div class="msg"><h2>' + title + '</h2>' + (text ? '<p>' + text + '</p>' : '') + (extra || '') + '</div>'; };
  const typeset = () => { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([app]).catch(() => {}); else setTimeout(typeset, 300); };

  let user = null, sess = null, attempt = null, offset = 0, timerId = null, pollId = null, finished = false;
  // Пробный режим: сеанс читает преподаватель курса, когда тест закрыт или его нет в списке допущенных.
  let preview = false;
  const answers = {};          // локальная копия: номер вопроса → индекс варианта
  const pending = {};          // ещё не сохранённые на сервере

  function info() { return CFDQuiz.quizInfo(CID, QID); }
  const serverNow = () => Date.now() + offset;
  const deadline = () => attempt.startedAt.toMillis() + (sess.durationSec || 900) * 1000;
  const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  async function loadSession() {
    try { const d = await firebase.firestore().collection("quiz_sessions").doc(CID + "_" + QID).get(); return d.exists ? d.data() : null; }
    catch (e) { return null; }
  }
  async function loadAttempt() {
    try { const d = await CFDQuiz.attemptRef(user.uid, CID, QID).get(); return d.exists ? d.data() : null; }
    catch (e) { return null; }
  }

  // Ждём открытия: документ сеанса виден студенту только при открытом тесте.
  function waitOpen() {
    msg("Тест закрыт", "Тест открывает преподаватель на занятии для отмеченных присутствующими. Страница обновится сама, когда тест откроется.");
    clearInterval(pollId);
    pollId = setInterval(async () => { const s = await loadSession(); if (s) { clearInterval(pollId); route(); } }, 5000);
  }

  async function route() {
    sess = await loadSession();
    if (!sess) { waitOpen(); return; }
    document.getElementById("title").textContent = sess.title || info().title;
    document.title = "ЧМ · " + (sess.title || "Тест");
    attempt = await loadAttempt();
    preview = !(sess.open && (sess.allowedUids || []).indexOf(user.uid) !== -1) && !(sess.showAnswers && (sess.allowedUids || []).indexOf(user.uid) !== -1);
    if (preview) {
      if (!attempt) { showIntro(); return; }
      if (attempt.submitted) { await showReview(); return; }
    } else if (sess.showAnswers && !sess.open) { await showReview(); return; }
    if (!attempt) { showIntro(); return; }
    if (attempt.submitted) { showFinished(); return; }
    // Продолжение после перезагрузки: пробная запись даёт серверное время.
    try {
      const t0 = Date.now(); const a = await CFDQuiz.touch(user, CID, QID); const t1 = Date.now();
      offset = a.updatedAt.toMillis() - (t0 + t1) / 2; attempt = a;
    } catch (e) { showFinished(true); return; }
    Object.assign(answers, attempt.answers || {});
    run();
  }

  function showIntro() {
    const n = (sess.questions || []).length, min = Math.round((sess.durationSec || 900) / 60);
    msg("Перед началом", preview ? '<b>Пробный режим преподавателя.</b> Попытка не попадает в результаты студентов; после завершения сразу показывается разбор.' : "",
      '<ul><li>' + n + ' вопросов, в каждом один верный вариант.</li>'
      + '<li>На весь тест — <b>' + min + ' мин</b>. Отсчёт начинается с нажатия кнопки и не останавливается при закрытии страницы.</li>'
      + '<li>Каждый выбранный ответ сразу сохраняется; до конца времени ответ можно изменить.</li>'
      + '<li>Попытка одна. Когда время выйдет, тест завершится сам с уже отмеченными ответами.</li>'
      + '<li>Пользоваться конспектами, телефоном и соседями нельзя.</li></ul>'
      + '<button class="btn" id="startBtn">Начать тест</button>');
    document.getElementById("startBtn").onclick = async function () {
      this.disabled = true;
      try {
        const t0 = Date.now(); attempt = await CFDQuiz.start(user, CID, QID); const t1 = Date.now();
        offset = attempt.startedAt.toMillis() - (t0 + t1) / 2;
        run();
      } catch (e) { this.disabled = false; alert("Не удалось начать тест: " + e.message + "\nВозможно, тест уже закрыт."); }
    };
  }

  function order() { return CFDQuiz.permutation(sess.questions.length, user.uid + "|" + QID); }
  function optOrder(qi) { return CFDQuiz.permutation(sess.questions[qi].options.length, user.uid + "|" + QID + "|" + qi); }

  function run() {
    const qs = sess.questions;
    app.innerHTML = '<div class="bar"><span class="timer" id="timer">—</span><span class="cnt" id="cnt"></span><span class="save" id="save"></span><button class="btn" id="finBtn">Завершить</button></div>'
      + order().map((qi, k) => '<div class="q"><div class="num">Вопрос ' + (k + 1) + ' из ' + qs.length + '</div><div class="text">' + qs[qi].text + '</div>'
        + optOrder(qi).map(oi => '<label><input type="radio" name="q' + qi + '" value="' + oi + '"' + (Number(answers[qi]) === oi && answers[qi] != null ? ' checked' : '') + '><span>' + qs[qi].options[oi] + '</span></label>').join('')
        + '</div>').join('');
    app.querySelectorAll('input[type=radio]').forEach(inp => inp.addEventListener('change', () => {
      const qi = inp.name.slice(1), oi = Number(inp.value);
      answers[qi] = oi; pending[qi] = oi; flush(); updCnt();
    }));
    document.getElementById("finBtn").onclick = async () => {
      const left = qs.length - Object.keys(answers).length;
      if (!confirm((left ? "Без ответа осталось вопросов: " + left + ".\n" : "") + "Завершить тест? Изменить ответы будет нельзя.")) return;
      await finish(false);
    };
    updCnt(); typeset();
    clearInterval(timerId); timerId = setInterval(tick, 250); tick();
    // Если преподаватель закроет тест, перестаём принимать ответы.
    clearInterval(pollId);
    if (!preview) pollId = setInterval(async () => { const s = await loadSession(); if (!s || !s.open) { await finish(true, "Преподаватель закрыл тест."); } }, 10000);
  }

  function updCnt() { const el = document.getElementById("cnt"); if (el) el.textContent = "отвечено " + Object.keys(answers).length + " из " + sess.questions.length; }
  function setSave(t) { const el = document.getElementById("save"); if (el) el.textContent = t; }

  let flushing = false;
  async function flush() {
    if (flushing || finished) return; flushing = true;
    try {
      while (Object.keys(pending).length) {
        const qi = Object.keys(pending)[0], oi = pending[qi];
        setSave("сохранение…");
        await CFDQuiz.saveAnswer(user, CID, QID, qi, oi);
        if (pending[qi] === oi) delete pending[qi];
      }
      setSave("ответы сохранены ✓");
    } catch (e) {
      setSave("⚠ не сохранено, повтор…");
      if (serverNow() < deadline()) setTimeout(() => { flushing = false; flush(); }, 3000);
      flushing = false; return;
    }
    flushing = false;
  }

  function tick() {
    const left = deadline() - serverNow();
    const el = document.getElementById("timer");
    if (el) { el.textContent = fmt(left); el.classList.toggle("low", left < 60000); }
    if (left <= 0) finish(true, "Время вышло.");
  }

  async function finish(auto, why) {
    if (finished) return; finished = true;
    clearInterval(timerId); clearInterval(pollId);
    app.querySelectorAll('input').forEach(i => i.disabled = true);
    try { if (Object.keys(pending).length) { flushing = false; finished = false; await flush(); finished = true; } } catch (e) {}
    try { await CFDQuiz.submit(user, CID, QID); } catch (e) {}
    if (preview) { attempt = await loadAttempt(); showReview(); return; }
    showFinished(auto, why);
  }

  async function showFinished(auto, why) {
    finished = true; clearInterval(timerId);
    const a = await loadAttempt(); const n = a ? Object.keys(a.answers || {}).length : 0;
    msg("Ответы приняты", (why ? why + " " : "") + "Сохранено ответов: " + n + " из " + ((sess && sess.questions) || []).length + ".",
      '<p>Результаты и разбор появятся на этой странице, когда преподаватель откроет ответы.</p>');
    clearInterval(pollId);
    pollId = setInterval(async () => { const s = await loadSession(); if (s && s.showAnswers && !s.open) { clearInterval(pollId); sess = s; showReview(); } }, 10000);
  }

  async function showReview() {
    const key = await CFDQuiz.getKey(CID, QID);
    if (!attempt) { msg("Разбор теста", "Вы не проходили этот тест."); return; }
    if (!key) { msg("Разбор теста", "Ключ ответов пока недоступен."); return; }
    const sc = CFDQuiz.score(attempt, key), qs = sess.questions;
    app.innerHTML = '<div class="finish"><div class="score">' + sc.score + ' / ' + sc.total + '</div><p style="color:var(--text2)">верных ответов</p>'
      + (preview ? '<p style="margin-top:.8rem"><button class="btn" id="retryBtn">Пройти заново</button></p>' : '') + '</div>'
      + order().map((qi, k) => {
          const mine = attempt.answers && attempt.answers[qi] != null ? Number(attempt.answers[qi]) : null, right = key.answers[qi];
          return '<div class="q ' + (mine === right ? 'done-ok' : 'done-bad') + '"><div class="num">Вопрос ' + (k + 1) + (mine == null ? ' · без ответа' : '') + '</div><div class="text">' + qs[qi].text + '</div>'
            + optOrder(qi).map(oi => '<label class="' + (oi === right ? 'right' : (oi === mine ? 'wrong' : '')) + '"><input type="radio" disabled' + (oi === mine ? ' checked' : '') + '><span>' + qs[qi].options[oi] + '</span></label>').join('')
            + (key.explanations && key.explanations[qi] ? '<div class="expl">' + key.explanations[qi] + '</div>' : '') + '</div>';
        }).join('');
    const rb = document.getElementById("retryBtn");
    if (rb) rb.onclick = async () => {
      rb.disabled = true;
      try { await CFDQuiz.resetAttempt(user.uid, CID, QID); } catch (e) {}
      for (const k in answers) delete answers[k];
      finished = false; attempt = null; route();
    };
    typeset();
  }

  if (!QID || !window.CFDQuiz) { msg("Тест не найден", "В адресе страницы нет номера теста."); return; }
  document.getElementById("title").textContent = info().title;
  firebase.auth().onAuthStateChanged(u => {
    if (user && u && u.uid === user.uid) return;
    user = u; clearInterval(pollId); clearInterval(timerId);
    if (!u) { msg("🔒 Войдите на сайт", "Тест доступен записанным на курс студентам во время занятия."); return; }
    route();
  });
})();
</script>
</body>
</html>
